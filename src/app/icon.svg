<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Doraemon Head -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#ffffff" stroke-width="3"/>
  <!-- White Face -->
  <ellipse cx="50" cy="56" rx="38" ry="32" fill="#ffffff"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="36" rx="10" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="60" cy="36" rx="10" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="43" cy="36" rx="3.5" ry="5.5" fill="#0f172a"/>
  <ellipse cx="57" cy="36" rx="3.5" ry="5.5" fill="#0f172a"/>
  <circle cx="44.5" cy="34" r="1.5" fill="#ffffff"/>
  <circle cx="58.5" cy="34" r="1.5" fill="#ffffff"/>
  <!-- Nose -->
  <circle cx="50" cy="48" r="6" fill="#ef4444"/>
  <circle cx="48" cy="46" r="1.8" fill="#ffffff"/>
  <line x1="50" y1="54" x2="50" y2="70" stroke="#1e293b" stroke-width="2"/>
  <!-- Smile -->
  <path d="M 28 66 Q 50 82 72 66" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="22" y1="52" x2="38" y2="54" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="58" x2="38" y2="58" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="64" x2="38" y2="62" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="78" y1="52" x2="62" y2="54" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="80" y1="58" x2="62" y2="58" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="78" y1="64" x2="62" y2="62" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Take-copter on top -->
  <rect x="48" y="4" width="4" height="12" rx="2" fill="#e2e8f0"/>
  <ellipse cx="50" cy="5" rx="22" ry="3.5" fill="#38bdf8"/>
  <circle cx="50" cy="5" r="2.5" fill="#f59e0b"/>
